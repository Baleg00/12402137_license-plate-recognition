<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>License Plate Segmentation + OCR (Browser)</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 24px;
    }

    .row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      width: 340px;
    }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
    }

    canvas,
    img {
      width: 100%;
      border-radius: 8px;
      background: #f6f6f6;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    select,
    input[type="file"] {
      padding: 6px;
    }

    .status {
      font-size: 13px;
      color: #333;
      margin-top: 8px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- onnxruntime-web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>

  <!-- OpenCV.js (for rectification) -->
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>

  <!-- Tesseract.js (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
  <h1>License Plate Segmentation + OCR (Browser)</h1>

  <div class="controls">
    <label>
      Model:
      <select id="modelSelect">
        <option value="baseline">baseline</option>
        <option value="se">se</option>
        <option value="cbam" selected>cbam</option>
      </select>
    </label>

    <label>
      Release tag:
      <input id="tagInput" class="mono" value="latest" style="width: 140px;" />
    </label>

    <label>
      Upload image:
      <input id="fileInput" type="file" accept="image/*" />
    </label>

    <button id="loadBtn">Load model</button>
    <button id="runBtn" disabled>Run inference</button>
  </div>

  <div class="status" id="status"></div>

  <div class="row">
    <div class="card">
      <h3>Input</h3>
      <canvas id="inputCanvas" width="640" height="384"></canvas>
    </div>

    <div class="card">
      <h3>Overlay (mask highlighted)</h3>
      <canvas id="overlayCanvas" width="640" height="384"></canvas>
    </div>

    <div class="card">
      <h3>Rectified plate crop</h3>
      <canvas id="cropCanvas" width="320" height="80"></canvas>
    </div>

    <div class="card">
      <h3>OCR prediction</h3>
      <div id="ocrText" class="mono" style="font-size: 18px; padding: 8px 0;">(none)</div>
      <div class="mono" style="font-size: 12px; color: #555;">
        OCR uses Tesseract.js (client-side). Replace with your OCR ONNX if desired.
      </div>
    </div>
  </div>

  <script>
    const GITHUB_OWNER = "Baleg00";
    const GITHUB_REPO = "12402137_license-plate-recognition";

    const SEG_ASSET_BY_MODEL = {
      baseline: "model-base.onnx",
      se: "model-se.onnx",
      cbam: "model-cbam.onnx",
    };

    const INPUT_H = 512;
    const INPUT_W = 512;

    const IMAGENET_MEAN = [0.485, 0.456, 0.406];
    const IMAGENET_STD = [0.229, 0.224, 0.225];

    let session = null;
    let currentImage = null; // HTMLImageElement
    let lastMask = null;     // Uint8Array (0/1) in original image resolution
    let lastCrop = null;     // ImageData or canvas

    const elStatus = document.getElementById("status");
    const elLoadBtn = document.getElementById("loadBtn");
    const elRunBtn = document.getElementById("runBtn");
    const elFile = document.getElementById("fileInput");
    const elModel = document.getElementById("modelSelect");
    const elTag = document.getElementById("tagInput");
    const elOcrText = document.getElementById("ocrText");

    const inputCanvas = document.getElementById("inputCanvas");
    const overlayCanvas = document.getElementById("overlayCanvas");
    const cropCanvas = document.getElementById("cropCanvas");

    function setStatus(msg) {
      elStatus.textContent = msg;
    }

    function normPlateText(s) {
      return (s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    async function fetchReleaseAssetUrl(tag, assetName) {
      const base = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases`;
      const url = (tag === "latest") ? `${base}/latest` : `${base}/tags/${encodeURIComponent(tag)}`;

      const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });

      if (!res.ok) {
        throw new Error(`GitHub API error (${res.status}): ${await res.text()}`);
      }

      const release = await res.json();

      const asset = (release.assets || []).find(a => a.name === assetName);

      if (!asset) {
        const names = (release.assets || []).map(a => a.name).join(", ");
        throw new Error(`Asset not found: ${assetName}. Available: ${names}`);
      }

      return asset.browser_download_url;
    }

    function drawImageContain(img, canvas, fill = "#f6f6f6") {
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = fill;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cw = canvas.width, ch = canvas.height;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const scale = Math.min(cw / iw, ch / ih);
      const nw = Math.round(iw * scale);
      const nh = Math.round(ih * scale);
      const dx = Math.floor((cw - nw) / 2);
      const dy = Math.floor((ch - nh) / 2);
      ctx.drawImage(img, dx, dy, nw, nh);
      return { scale, dx, dy, nw, nh };
    }

    function getImageDataFromImage(img) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);
      return ctx.getImageData(0, 0, c.width, c.height);
    }

    // Letterbox to INPUT_H x INPUT_W; returns {data: Float32Array, meta}
    function preprocessToNCHWFloat32(imgData) {
      const oh = imgData.height, ow = imgData.width;
      const th = INPUT_H, tw = INPUT_W;

      const scale = Math.min(tw / ow, th / oh);
      const nw = Math.round(ow * scale);
      const nh = Math.round(oh * scale);

      const padLeft = Math.floor((tw - nw) / 2);
      const padTop = Math.floor((th - nh) / 2);

      // Draw resized onto a temp canvas
      const c = document.createElement("canvas");
      c.width = tw; c.height = th;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "rgb(114,114,114)";
      ctx.fillRect(0, 0, tw, th);

      // Resize original into another canvas
      const src = document.createElement("canvas");
      src.width = ow; src.height = oh;
      src.getContext("2d").putImageData(imgData, 0, 0);

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(src, 0, 0, ow, oh, padLeft, padTop, nw, nh);

      const lb = ctx.getImageData(0, 0, tw, th).data; // RGBA
      const out = new Float32Array(1 * 3 * th * tw);

      // NCHW
      let idxR = 0;
      let idxG = th * tw;
      let idxB = 2 * th * tw;

      for (let y = 0; y < th; y++) {
        for (let x = 0; x < tw; x++) {
          const i = (y * tw + x) * 4;
          const r = lb[i] / 255.0;
          const g = lb[i + 1] / 255.0;
          const b = lb[i + 2] / 255.0;

          out[idxR++] = (r - IMAGENET_MEAN[0]) / IMAGENET_STD[0];
          out[idxG++] = (g - IMAGENET_MEAN[1]) / IMAGENET_STD[1];
          out[idxB++] = (b - IMAGENET_MEAN[2]) / IMAGENET_STD[2];
        }
      }

      return {
        tensorData: out,
        meta: { oh, ow, scale, padLeft, padTop, nw, nh, th, tw }
      };
    }

    // Convert model output mask [H,W] in letterbox space -> original size binary mask
    function postprocessMaskToOriginal(maskFloat, meta, thr = 0.5) {
      const { oh, ow, padLeft, padTop, nw, nh, th, tw } = meta;

      // maskFloat length = th*tw
      // 1) binarize in letterbox space
      const bin = new Uint8Array(th * tw);
      for (let i = 0; i < bin.length; i++) bin[i] = (maskFloat[i] >= thr) ? 1 : 0;

      // 2) crop padding: region [padTop:padTop+nh, padLeft:padLeft+nw]
      const cropped = new Uint8Array(nh * nw);
      for (let y = 0; y < nh; y++) {
        const srcOff = (padTop + y) * tw + padLeft;
        const dstOff = y * nw;
        cropped.set(bin.subarray(srcOff, srcOff + nw), dstOff);
      }

      // 3) resize to original size (nearest) using canvas trick
      const c = document.createElement("canvas");
      c.width = nw; c.height = nh;
      const ctx = c.getContext("2d");
      const imgData = ctx.createImageData(nw, nh);
      for (let i = 0; i < cropped.length; i++) {
        const v = cropped[i] ? 255 : 0;
        imgData.data[i * 4 + 0] = v;
        imgData.data[i * 4 + 1] = v;
        imgData.data[i * 4 + 2] = v;
        imgData.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);

      const outC = document.createElement("canvas");
      outC.width = ow; outC.height = oh;
      const outCtx = outC.getContext("2d");
      outCtx.imageSmoothingEnabled = false; // nearest neighbor
      outCtx.drawImage(c, 0, 0, nw, nh, 0, 0, ow, oh);

      const outImg = outCtx.getImageData(0, 0, ow, oh).data;
      const outMask = new Uint8Array(ow * oh);
      for (let i = 0; i < outMask.length; i++) outMask[i] = outImg[i * 4] > 0 ? 1 : 0;

      return outMask;
    }

    function drawOverlay(img, mask01, overlayCanvas) {
      const ctx = overlayCanvas.getContext("2d");
      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      const { scale, dx, dy, nw, nh } = drawImageContain(img, overlayCanvas);

      // Overlay mask on the displayed region (same scaled size)
      // We'll render mask to a temp canvas at original size then scale it.
      const ow = img.naturalWidth, oh = img.naturalHeight;

      const mC = document.createElement("canvas");
      mC.width = ow; mC.height = oh;
      const mCtx = mC.getContext("2d");
      const mData = mCtx.createImageData(ow, oh);
      for (let i = 0; i < mask01.length; i++) {
        const v = mask01[i] ? 255 : 0;
        mData.data[i * 4 + 0] = 255; // red overlay
        mData.data[i * 4 + 1] = 0;
        mData.data[i * 4 + 2] = 0;
        mData.data[i * 4 + 3] = v ? 110 : 0; // alpha where mask is 1
      }
      mCtx.putImageData(mData, 0, 0);

      ctx.drawImage(mC, 0, 0, ow, oh, dx, dy, nw, nh);
    }

    function cropViaBBox(img, mask01) {
      const ow = img.naturalWidth, oh = img.naturalHeight;
      let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
      for (let y = 0; y < oh; y++) {
        for (let x = 0; x < ow; x++) {
          if (mask01[y * ow + x]) {
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;
      const pad = 8;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(ow - 1, maxX + pad);
      maxY = Math.min(oh - 1, maxY + pad);

      const src = document.createElement("canvas");
      src.width = ow; src.height = oh;
      src.getContext("2d").drawImage(img, 0, 0);

      const w = maxX - minX + 1;
      const h = maxY - minY + 1;

      const out = document.createElement("canvas");
      out.width = w; out.height = h;
      out.getContext("2d").drawImage(src, minX, minY, w, h, 0, 0, w, h);
      return out;
    }

    function rectifyWithOpenCV(img, mask01) {
      // Requires OpenCV.js ready. Uses mask contours -> minAreaRect -> warpPerspective.
      if (!window.cv || !window.cv.Mat) return null;

      const ow = img.naturalWidth, oh = img.naturalHeight;
      const srcCanvas = document.createElement("canvas");
      srcCanvas.width = ow; srcCanvas.height = oh;
      srcCanvas.getContext("2d").drawImage(img, 0, 0);

      // Build mask image
      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = ow; maskCanvas.height = oh;
      const mctx = maskCanvas.getContext("2d");
      const mdata = mctx.createImageData(ow, oh);
      for (let i = 0; i < mask01.length; i++) {
        const v = mask01[i] ? 255 : 0;
        mdata.data[i * 4 + 0] = v; mdata.data[i * 4 + 1] = v; mdata.data[i * 4 + 2] = v; mdata.data[i * 4 + 3] = 255;
      }
      mctx.putImageData(mdata, 0, 0);

      const src = cv.imread(srcCanvas);     // RGBA
      const m = cv.imread(maskCanvas);      // RGBA
      cv.cvtColor(m, m, cv.COLOR_RGBA2GRAY);

      const contours = new cv.MatVector();
      const hierarchy = new cv.Mat();
      cv.findContours(m, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      if (contours.size() === 0) {
        src.delete(); m.delete(); contours.delete(); hierarchy.delete();
        return null;
      }

      // Largest contour
      let bestIdx = 0;
      let bestArea = 0;
      for (let i = 0; i < contours.size(); i++) {
        const c = contours.get(i);
        const area = cv.contourArea(c);
        if (area > bestArea) { bestArea = area; bestIdx = i; }
      }
      const cnt = contours.get(bestIdx);

      const rect = cv.minAreaRect(cnt);
      const box = cv.RotatedRect.points(rect); // 4 points
      // box is array of cv.Point

      // Order points roughly (tl,tr,br,bl) by sum/diff
      const pts = box.map(p => [p.x, p.y]);
      const s = pts.map(p => p[0] + p[1]);
      const d = pts.map(p => p[0] - p[1]);
      const tl = pts[s.indexOf(Math.min(...s))];
      const br = pts[s.indexOf(Math.max(...s))];
      const tr = pts[d.indexOf(Math.min(...d))];
      const bl = pts[d.indexOf(Math.max(...d))];

      const w1 = Math.hypot(tr[0] - tl[0], tr[1] - tl[1]);
      const w2 = Math.hypot(br[0] - bl[0], br[1] - bl[1]);
      const h1 = Math.hypot(bl[0] - tl[0], bl[1] - tl[1]);
      const h2 = Math.hypot(br[0] - tr[0], br[1] - tr[1]);
      const W = Math.max(1, Math.round(Math.max(w1, w2)));
      const H = Math.max(1, Math.round(Math.max(h1, h2)));

      const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [...tl, ...tr, ...br, ...bl]);
      const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, W - 1, 0, W - 1, H - 1, 0, H - 1]);

      const M = cv.getPerspectiveTransform(srcPts, dstPts);
      const dst = new cv.Mat();
      cv.warpPerspective(src, dst, M, new cv.Size(W, H), cv.INTER_CUBIC, cv.BORDER_CONSTANT, new cv.Scalar());

      // Convert back to canvas
      const outCanvas = document.createElement("canvas");
      outCanvas.width = W; outCanvas.height = H;
      cv.imshow(outCanvas, dst);

      // Cleanup
      src.delete(); m.delete(); contours.delete(); hierarchy.delete();
      srcPts.delete(); dstPts.delete(); M.delete(); dst.delete();

      return outCanvas;
    }

    function drawToCropCanvas(c) {
      const ctx = cropCanvas.getContext("2d");
      ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      // Fit crop into cropCanvas
      const cw = cropCanvas.width, ch = cropCanvas.height;
      const scale = Math.min(cw / c.width, ch / c.height);
      const nw = Math.round(c.width * scale);
      const nh = Math.round(c.height * scale);
      const dx = Math.floor((cw - nw) / 2);
      const dy = Math.floor((ch - nh) / 2);
      ctx.drawImage(c, dx, dy, nw, nh);
    }

    async function runOCRFromCanvas(canvas) {
      // Simple settings for plates: uppercase + digits
      const { data } = await Tesseract.recognize(canvas, "eng", {
        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
      });
      return normPlateText(data.text || "");
    }

    async function loadSelectedModel() {
      setStatus("Fetching model asset URL from GitHub releases...");
      elLoadBtn.disabled = true;
      elRunBtn.disabled = true;

      try {
        const modelKey = elModel.value;
        const tag = elTag.value.trim() || "latest";
        const assetName = SEG_ASSET_BY_MODEL[modelKey];

        const url = await fetchReleaseAssetUrl(tag, assetName);
        setStatus(`Downloading and initializing ONNX model: ${assetName}`);

        ort.env.wasm.numThreads = navigator.hardwareConcurrency || 4;
        ort.env.wasm.simd = true;

        session = await ort.InferenceSession.create(url, { executionProviders: ["wasm"] });
        setStatus(`Model loaded: ${assetName}`);
        elRunBtn.disabled = (currentImage === null);
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message || err}`);
      } finally {
        elLoadBtn.disabled = false;
      }
    }

    async function runInference() {
      if (!session) { setStatus("Load a model first."); return; }
      if (!currentImage) { setStatus("Upload an image first."); return; }

      elRunBtn.disabled = true;
      elOcrText.textContent = "(running...)";
      setStatus("Preprocessing image...");

      try {
        // Original image data
        const imgData = getImageDataFromImage(currentImage);
        const { tensorData, meta } = preprocessToNCHWFloat32(imgData);

        // Create input tensor
        const inputName = session.inputNames[0];
        const inputTensor = new ort.Tensor("float32", tensorData, [1, 3, INPUT_H, INPUT_W]);

        setStatus("Running segmentation inference...");
        const outputs = await session.run({ [inputName]: inputTensor });

        // Get output tensor (first output)
        const outName = session.outputNames[0];
        const outTensor = outputs[outName];

        // outTensor.data might be Float32Array length = 1*1*H*W
        const logits = outTensor.data;
        const probs = new Float32Array(INPUT_H * INPUT_W);
        for (let i = 0; i < probs.length; i++) {
          const z = logits[i];
          probs[i] = 1.0 / (1.0 + Math.exp(-z)); // sigmoid
        }

        // Map back to original resolution
        setStatus("Postprocessing mask...");
        lastMask = postprocessMaskToOriginal(probs, meta, 0.5);

        // Render input & overlay
        drawImageContain(currentImage, inputCanvas);
        drawOverlay(currentImage, lastMask, overlayCanvas);

        // Rectify + crop
        setStatus("Rectifying plate crop...");
        let crop = rectifyWithOpenCV(currentImage, lastMask);
        if (!crop) crop = cropViaBBox(currentImage, lastMask);

        if (!crop) {
          drawToCropCanvas(document.createElement("canvas"));
          elOcrText.textContent = "(no plate found)";
          setStatus("No plate region detected.");
          return;
        }

        drawToCropCanvas(crop);

        // OCR
        setStatus("Running OCR (Tesseract.js)...");
        const ocrPred = await runOCRFromCanvas(crop);
        elOcrText.textContent = ocrPred || "(empty)";

        setStatus("Done.");
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message || err}`);
        elOcrText.textContent = "(error)";
      } finally {
        elRunBtn.disabled = false;
      }
    }

    elLoadBtn.addEventListener("click", loadSelectedModel);
    elRunBtn.addEventListener("click", runInference);

    elFile.addEventListener("change", async (ev) => {
      const f = ev.target.files?.[0];
      if (!f) return;
      const url = URL.createObjectURL(f);

      const img = new Image();
      img.onload = () => {
        currentImage = img;
        drawImageContain(img, inputCanvas);
        // Clear other views
        overlayCanvas.getContext("2d").clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        cropCanvas.getContext("2d").clearRect(0, 0, cropCanvas.width, cropCanvas.height);
        elOcrText.textContent = "(none)";
        elRunBtn.disabled = (session === null);
        setStatus("Image loaded. Load model (if not loaded) and run inference.");
        URL.revokeObjectURL(url);
      };
      img.src = url;
    });

    // Indicate OpenCV readiness
    const opencvCheck = setInterval(() => {
      if (window.cv && window.cv.Mat) {
        setStatus((elStatus.textContent || "") + " (OpenCV ready)");
        clearInterval(opencvCheck);
      }
    }, 500);
  </script>
</body>

</html>
